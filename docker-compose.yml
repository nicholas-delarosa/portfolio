# Producción (y prueba completa en local): docker compose up -d --build
name: portfolio

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./Portfolio.Backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-portfolio};Username=${POSTGRES_USER:-portfolio};Password=${POSTGRES_PASSWORD}
      Admin__GitHubLogin: ${ADMIN_GITHUB_LOGIN:-nicholas-delarosa}
      GitHubOAuth__ClientId: ${GITHUB_OAUTH_CLIENT_ID:-}
      GitHubOAuth__ClientSecret: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GitHub__Token: ${GITHUB_TOKEN:-}
      Cloudinary__Url: ${CLOUDINARY_URL:-}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      Email__NotifyTo: ${NOTIFY_EMAIL:-}
      Screenshots__PlaywrightWsEndpoint: ws://screenshots:3000/

  # Navegador sin pantalla para las capturas de los demos. La versión debe coincidir con Microsoft.Playwright del backend
  screenshots:
    image: mcr.microsoft.com/playwright:v1.64.0-noble
    restart: unless-stopped
    init: true
    user: pwuser
    ipc: host
    working_dir: /home/pwuser
    command: ["npx", "-y", "playwright@1.64.0", "run-server", "--port", "3000", "--host", "0.0.0.0"]

  web:
    build: ./Portfolio.Frontend
    restart: unless-stopped

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # Dominio real (ej. nicholas-delarosa.is-a.dev) => HTTPS automático. ":80" => solo HTTP para pruebas locales
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
