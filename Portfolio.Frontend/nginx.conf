server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Archivos con hash en el nombre (Vite): se pueden guardar en caché para siempre
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.ttf$ {
        types { }
        default_type font/ttf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(mp3|wav|png|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Aplicación de una sola página: cualquier ruta (/es/proyectos, /admin...) carga index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
