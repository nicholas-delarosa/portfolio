# Desarrollo: solo la base de datos. El backend y el frontend corren en tu PC (dotnet run / npm run dev)
# docker compose -f docker-compose.dev.yml up -d
name: portfolio-dev

services:
  db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev
    ports:
      - "5440:5432" # 5432-5433 ya los usan otros proyectos en tu PC
    volumes:
      - db-dev-data:/var/lib/postgresql

volumes:
  db-dev-data:
